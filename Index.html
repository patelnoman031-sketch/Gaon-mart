<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaon Mart Admin</title><style>
body{margin:0;font-family:Arial;background:#f4f6f5;color:#17201b}header{background:#16834a;color:white;padding:18px;font-size:22px;font-weight:700}nav{display:flex;gap:8px;overflow:auto;background:white;padding:10px}nav button{border:0;border-radius:8px;padding:11px 15px;background:#edf5ef;color:#176b3d}.on,.save{background:#16834a!important;color:white!important}main{max-width:950px;margin:auto;padding:16px}.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.grid,.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px;box-sizing:border-box}.save{border:0;border-radius:8px;padding:12px 18px;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.wrap{overflow:auto}.hide{display:none}.big{font-size:28px;font-weight:bold}.status{padding:10px;border-radius:8px;background:#fff8e1;margin-bottom:14px}@media(max-width:600px){.grid,.row{grid-template-columns:1fr}}.muted{color:#69736d;font-size:12px}.statusBadge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f5e9;color:#176b3d;font-size:12px;font-weight:700}.stockLow{color:#b54708;font-weight:700}.stockOut{color:#b42318;font-weight:700}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:700px){.statGrid{grid-template-columns:1fr 1fr}}.steps{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.step{padding:5px 8px;border-radius:7px;background:#eef1ef;color:#66716b;font-size:11px}.step.active{background:#16834a;color:#fff}.danger{background:#b42318!important;color:#fff}.warn{background:#fff4e5!important;color:#8a4b00}</style></head><body>
<header>🛒 Gaon Mart <small style="float:right;font-size:13px">Admin</small></header><nav><button class="on" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('products',this)">Products</button><button onclick="tab('orders',this)">Orders</button><button onclick="tab('categories',this)">Categories</button><button onclick="tab('delivery',this)">Delivery</button></nav><main>
<div id="status" class="status">Connecting to database…</div>
<section id="dash"><h2>Dashboard</h2><div class="statGrid"><div class="card"><div>Today's Orders</div><div class="big" id="todayOrders">0</div></div><div class="card"><div>Pending</div><div class="big" id="pendingOrders">0</div></div><div class="card"><div>Today's Sales</div><div class="big" id="todaySales">₹0</div></div><div class="card"><div>Low Stock</div><div class="big" id="lowStock">0</div></div></div><div class="card"><b>Service area</b><p>Mosali, Surat, Gujarat + nearby villages</p><button class="save" onclick="loadDashboard()">↻ Refresh Dashboard</button></div></section>
<section id="products" class="hide"><h2>Products</h2><div class="card"><div class="row"><div><label>Product name</label><input id="name" placeholder="Tomato"></div><div><label>Category</label><select id="cat"></select></div></div><div class="row"><div><label>Variant / quantity</label><input id="variant" placeholder="1 kg"></div><div><label>Price ₹</label><input id="price" type="number" placeholder="40"></div></div><label>Stock</label><input id="stock" type="number" min="0" placeholder="50"><button class="save" onclick="addProduct()">Save Product</button></div><div class="card wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Variant</th><th>Price</th><th>Stock</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="orders" class="hide">
<h2>Orders <button class="save" style="float:right" onclick="loadOrders()">↻ Refresh</button></h2>
<div id="orderList"></div>
</section><section id="categories" class="hide"><h2>Categories</h2><div class="card" id="catList"></div></section><section id="delivery" class="hide"><h2>Delivery Settings</h2><div class="card"><label>Delivery charge per km ₹</label><input value="3.50" type="number"><button class="save" onclick="alert('Settings UI ready')">Save Settings</button></div></section></main>
<script>
const URL="https://dayhqgusooffpcvpdfxl.supabase.co",KEY="sb_publishable_YfZ4zPMbCplUIdjTQv8Ciw_7mfLW47w";let products=[];
async function api(path,opt={}){let h={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",...(opt.headers||{})};let r=await fetch(URL+"/rest/v1/"+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}
function tab(id,b){document.querySelectorAll("main section").forEach(x=>x.classList.add("hide"));document.getElementById(id).classList.remove("hide");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id==="orders")loadOrders()}

const orderStatuses=["pending","accepted","packing","out_for_delivery","delivered","cancelled"];

async function loadOrders(){
  const box=document.getElementById("orderList");
  box.innerHTML='<div class="card">Loading orders…</div>';
  try{
    const orders=await api("orders?select=*&order=created_at.desc&limit=100");
    if(!orders.length){box.innerHTML='<div class="card">No orders yet.</div>';return;}
    const ids=orders.map(o=>o.id);
    const qs=ids.map(id=>encodeURIComponent(id)).join(",");
    const items=await api("order_items?select=*&order_id=in.("+qs+")&order_id=not.is.null");
    const byOrder={};
    items.forEach(i=>(byOrder[i.order_id]??=[]).push(i));
    box.innerHTML=orders.map(o=>{
      const its=byOrder[o.id]||[];
      const itemHtml=its.length
        ? '<ul style="margin:8px 0 0 18px">'+its.map(i=>`<li>${esc(i.product_name||"Product")} — ${esc(i.variant_label||"")} × ${i.quantity} = ₹${Number(i.line_total||0).toFixed(2)}</li>`).join("")+'</ul>'
        : '<span class="muted">Items not available</span>';
      return `<div class="card">
        <div><b>Order #${o.id.slice(0,8)}</b> <span class="muted">${new Date(o.created_at).toLocaleString()}</span></div>
        <p><b>Phone:</b> ${esc(o.phone||"—")}<br><b>Address:</b> ${esc(o.delivery_address||"—")}<br><b>Distance:</b> ${o.distance_km??"—"} km</p>
        <p><b>Items:</b>${itemHtml}</p>
        <p><b>Subtotal:</b> ₹${Number(o.subtotal||0).toFixed(2)} &nbsp; <b>Delivery:</b> ₹${Number(o.delivery_charge||0).toFixed(2)} &nbsp; <b>Total:</b> ₹${Number(o.total||0).toFixed(2)}</p>
        <p><b>Payment:</b> ${esc(o.payment_method||"—")} / ${esc(o.payment_status||"—")}</p>
        <div><b>Status:</b> <span class="statusBadge">${esc((o.order_status||"pending").replaceAll("_"," ").toUpperCase())}</span> ${o.stock_deducted?`<span class="statusBadge">STOCK DEDUCTED</span>`:""}</div>
        <div class="steps">${orderStatuses.filter(s=>s!=="cancelled").map(s=>`<span class="step ${o.order_status===s?"active":""}">${s.replaceAll("_"," ")}</span>`).join("")}</div>
        <label><b>Change order status</b></label>
        <select onchange="updateOrderStatus('${o.id}',this.value)">
          ${orderStatuses.map(s=>`<option value="${s}" ${o.order_status===s?"selected":""}>${s.replaceAll("_"," ").toUpperCase()}</option>`).join("")}
        </select>
      </div>`;
    }).join("");
  }catch(e){box.innerHTML='<div class="card">Orders load failed: '+esc(e.message)+'</div>';}
}

async function updateOrderStatus(id,status){
  try{
    await api("orders?id=eq."+encodeURIComponent(id),{
      method:"PATCH",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({order_status:status,updated_at:new Date().toISOString()})
    });
    await loadOrders(); await loadDashboard();
  }catch(e){alert("Status update failed: "+e.message);}
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

async function load(){try{let c=await api("categories?select=*&active=eq.true&order=name");cat.innerHTML=c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");catList.innerHTML=c.map(x=>`<p>• ${esc(x.name)}</p>`).join("");products=await api("product_variants?select=*,products(id,name,category_id,categories(name))&active=eq.true&order=created_at.desc");render();await loadDashboard();status.textContent="Connected to Gaon Mart database ✓";status.style.background="#e8f5e9"}catch(e){status.textContent="Connection/table check needed: "+e.message}}
function render(){pc.textContent=products.length;rows.innerHTML=products.map(x=>{const st=Number(x.stock||0);return `<tr><td>${esc(x.products?.name||"")}</td><td>${esc(x.products?.categories?.name||"")}</td><td>${esc(x.label||"")}</td><td>₹${Number(x.price||0).toFixed(0)}</td><td class="${st<=0?'stockOut':st<=5?'stockLow':''}">${st}</td></tr>`}).join("")}
async function addProduct(){let n=name.value.trim(),v=variant.value.trim(),p=Number(price.value),s=Number(stock.value||0),c=cat.value;if(!n||!v||p<0||!c)return alert("Product, category, variant and valid price required");try{const prod=(await api("products",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({name:n,category_id:c,active:true})}))[0];await api("product_variants",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({product_id:prod.id,label:v,quantity:1,unit:"pcs",price:p,stock:s,active:true})});await load();name.value="";variant.value="";price.value="";stock.value="";alert("Product saved ✓")}catch(e){alert("Save failed: "+e.message)}}
async function loadDashboard(){try{const orders=await api("orders?select=id,created_at,order_status,total,stock_deducted&order=created_at.desc&limit=500"), variants=await api("product_variants?select=stock&active=eq.true");const today=new Date().toISOString().slice(0,10);const todayRows=orders.filter(o=>String(o.created_at).slice(0,10)===today);todayOrders.textContent=todayRows.length;pendingOrders.textContent=orders.filter(o=>["pending","placed"].includes(o.order_status)).length;todaySales.textContent="₹"+todayRows.filter(o=>o.order_status!=="cancelled").reduce((a,o)=>a+Number(o.total||0),0).toFixed(0);lowStock.textContent=variants.filter(v=>Number(v.stock||0)<=5).length}catch(e){}}
load();loadOrders();
</script></body></html>
