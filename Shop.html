<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaon Mart</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f7f6;color:#17201b;padding-bottom:75px}header{position:sticky;top:0;background:#16834a;color:#fff;padding:15px 16px;z-index:5}.logo{font-size:23px;font-weight:700}.location{margin-top:8px;background:#fff2;padding:8px;border-radius:8px}main{max-width:700px;margin:auto;padding:14px}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cats button{white-space:nowrap;border:0;border-radius:20px;padding:9px 14px;background:#e9f4ed;color:#176b3d}.cats .sel{background:#16834a;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product,.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001}.emoji{text-align:center;font-size:40px;padding:8px}.name{font-weight:700}.muted{color:#69736d;font-size:13px}.price{font-weight:700;margin:7px 0}.qty{display:flex;align-items:center;gap:6px}.qty button{border:0;border-radius:7px;padding:8px}.add,.primary,.cartbtn{background:#16834a;color:white;font-weight:700;border:0;border-radius:9px;padding:11px}.add{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:10px;z-index:6}.cartbtn{width:100%;max-width:700px;display:block;margin:auto}.screen{display:none}.screen.active{display:block}.back{border:0;background:none;font-size:18px;margin-bottom:8px}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.form input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px}.pay{display:flex;gap:8px}.pay button{flex:1;padding:11px;border:1px solid #ccc;border-radius:8px;background:white}.pay .active{border:2px solid #16834a}.primary{width:100%}.empty{text-align:center;padding:40px;color:#667}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="logo">🛒 Gaon Mart</div><div class="location">📍 Location not selected</div></header><main><section id="home" class="screen active"><input class="search" id="search" placeholder="Search vegetables, grocery..." oninput="render()"><div class="cats" id="cats"></div><div class="grid" id="products"></div></section><section id="cartScreen" class="screen"><button class="back" onclick="show('home')">← Continue Shopping</button><h2>Your Cart</h2><div id="cart"></div></section><section id="checkout" class="screen"><button class="back" onclick="show('cartScreen')">← Back</button><h2>Checkout</h2><div class="card form"><label>Delivery location</label><input id="address" placeholder="House/shop, village"><label>Mobile number</label><input id="phone" type="tel" placeholder="10 digit mobile number"><label>Distance from store (km)</label><input id="distance" type="number" step=".1" placeholder="Example: 3"></div><div class="card"><b>Payment</b><div class="pay"><button id="cod" class="active" onclick="payment('COD')">💵 Cash on Delivery</button><button id="upi" onclick="payment('UPI')">📲 UPI</button></div></div><div class="card" id="summary"></div><button class="primary" onclick="placeOrder()">Place Order</button></section></main><div class="bottom"><button class="cartbtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>) · ₹<span id="total">0</span></button></div><script>
const URL="https://dayhqgusooffpcvpdfxl.supabase.co",KEY="sb_publishable_YfZ4zPMbCplUIdjTQv8Ciw_7mfLW47w";let variants=[],cart={},selectedCat="all",payMethod="COD",rate=3.5;
async function api(path,opt={}){let h={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",...(opt.headers||{})},r=await fetch(URL+"/rest/v1/"+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){try{let c=await api("categories?select=*&active=eq.true&order=sort_order,name");variants=await api("product_variants?select=*,products(id,name,category_id)&active=eq.true&order=created_at.desc");cats.innerHTML='<button class="sel" onclick="category(\'all\',this)">All</button>'+c.map(x=>`<button onclick="category('${x.id}',this)">${esc(x.name)}</button>`).join("");render()}catch(e){products.innerHTML='<div class="empty">Products are not available yet.</div>'}}
function category(id,b){selectedCat=id;document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");render()}
function render(){let q=search.value.toLowerCase(),a=variants.filter(v=>(selectedCat==="all"||v.products?.category_id===selectedCat)&&((v.products?.name||"")+" "+(v.label||"")).toLowerCase().includes(q));products.innerHTML=a.length?a.map(v=>`<div class="product"><div class="emoji">🛍️</div><div class="name">${esc(v.products?.name)}</div><div class="muted">${esc(v.label)}</div><div class="price">₹${v.price}</div><div class="qty"><button onclick="change('${v.id}',-1)">−</button><b>${cart[v.id]?.qty||0}</b><button onclick="change('${v.id}',1)">+</button><button class="add" onclick="change('${v.id}',1)">Add</button></div></div>`).join(""):'<div class="empty">No products found.</div>';update()}
function change(id,d){let v=variants.find(x=>x.id===id);if(!v)return;cart[id]??={v,qty:0};cart[id].qty=Math.max(0,Math.min(Number(v.stock||9999),cart[id].qty+d));if(!cart[id].qty)delete cart[id];render()}
function update(){count.textContent=Object.values(cart).reduce((a,x)=>a+x.qty,0);total.textContent=Object.values(cart).reduce((a,x)=>a+x.qty*x.v.price,0).toFixed(0)}
function openCart(){show("cartScreen");cart.innerHTML=Object.values(window.cart).length?Object.values(window.cart).map(x=>`<div class="card line"><span>${esc(x.v.products?.name)}<br><small>${esc(x.v.label)}</small></span><b>₹${x.v.price*x.qty}</b></div>`).join("")+'<button class="primary" onclick="showCheckout()">Proceed to Checkout</button>':'<div class="empty">Your cart is empty.</div>'}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function showCheckout(){show("checkout");calc()}
function payment(x){payMethod=x;cod.classList.toggle("active",x==="COD");upi.classList.toggle("active",x==="UPI")}
function calc(){let s=Object.values(cart).reduce((a,x)=>a+x.qty*x.v.price,0),d=Number(distance.value||0)*rate;summary.innerHTML=`<div class="line"><span>Items</span><b>₹${s}</b></div><div class="line"><span>Delivery</span><b>₹${d.toFixed(0)}</b></div><div class="line"><span>Total</span><b>₹${(s+d).toFixed(0)}</b></div>`}
distance.oninput=calc;
async function placeOrder(){let a=address.value.trim(),p=phone.value.trim();if(!a||p.length<10)return alert("Address and valid mobile number required");let items=Object.values(cart),s=items.reduce((x,y)=>x+y.qty*y.v.price,0),km=Number(distance.value||0),d=km*rate;try{let o=(await api("orders",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({delivery_address:a,phone:p,subtotal:s,delivery_charge:d,total:s+d,payment_method:payMethod,order_status:"pending",distance_km:km})}))[0];await api("order_items",{method:"POST",body:JSON.stringify(items.map(x=>({order_id:o.id,product_variant_id:x.v.id,quantity:x.qty,unit_price:x.v.price,line_total:x.qty*x.v.price})))});alert("Order placed successfully!");cart={};update();show("home");render()}catch(e){alert("Order failed: "+e.message)}}
load();
</script></body></html>
