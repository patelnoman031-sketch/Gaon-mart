<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaon Mart Admin</title><style>
body{margin:0;font-family:Arial;background:#f4f6f5;color:#17201b}header{background:#16834a;color:white;padding:18px;font-size:22px;font-weight:700}nav{display:flex;gap:8px;overflow:auto;background:white;padding:10px}nav button{border:0;border-radius:8px;padding:11px 15px;background:#edf5ef;color:#176b3d}.on,.save{background:#16834a!important;color:white!important}main{max-width:950px;margin:auto;padding:16px}.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.grid,.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px;box-sizing:border-box}.save{border:0;border-radius:8px;padding:12px 18px;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.wrap{overflow:auto}.hide{display:none}.big{font-size:28px;font-weight:bold}.status{padding:10px;border-radius:8px;background:#fff8e1;margin-bottom:14px}@media(max-width:600px){.grid,.row{grid-template-columns:1fr}}</style></head><body>
<header>🛒 Gaon Mart <small style="float:right;font-size:13px">Admin</small></header><nav><button class="on" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('products',this)">Products</button><button onclick="tab('orders',this)">Orders</button><button onclick="tab('categories',this)">Categories</button><button onclick="tab('delivery',this)">Delivery</button></nav><main>
<div id="status" class="status">Connecting to database…</div>
<section id="dash"><h2>Dashboard</h2><div class="grid"><div class="card">Today's Orders<div class="big">0</div></div><div class="card">Products<div class="big" id="pc">0</div></div><div class="card">Pending Orders<div class="big">0</div></div><div class="card">Today's Sales<div class="big">₹0</div></div></div><div class="card"><b>Service area</b><p>Mosali, Surat, Gujarat + nearby villages</p></div></section>
<section id="products" class="hide"><h2>Products</h2><div class="card"><div class="row"><div><label>Product name</label><input id="name" placeholder="Tomato"></div><div><label>Category</label><select id="cat"></select></div></div><div class="row"><div><label>Variant / quantity</label><input id="variant" placeholder="1 kg"></div><div><label>Price ₹</label><input id="price" type="number" placeholder="40"></div></div><label>Stock</label><input id="stock" type="number" placeholder="50"><button class="save" onclick="addProduct()">Save Product</button></div><div class="card wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Variant</th><th>Price</th><th>Stock</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="orders" class="hide"><h2>Orders</h2><div class="card">No orders yet.</div></section><section id="categories" class="hide"><h2>Categories</h2><div class="card" id="catList"></div></section><section id="delivery" class="hide"><h2>Delivery Settings</h2><div class="card"><label>Delivery charge per km ₹</label><input value="3.50" type="number"><button class="save" onclick="alert('Settings UI ready')">Save Settings</button></div></section></main>
<script>
const URL="https://dayhqgusooffpcvpdfxl.supabase.co",KEY="sb_publishable_YfZ4zPMbCplUIdjTQv8Ciw_7mfLW47w";let products=[];
async function api(path,opt={}){let h={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",...(opt.headers||{})};let r=await fetch(URL+"/rest/v1/"+path,{...opt,headers:h});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
function tab(id,b){document.querySelectorAll("main section").forEach(x=>x.classList.add("hide"));document.getElementById(id).classList.remove("hide");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
async function load(){try{let c=await api("categories?select=*&active=eq.true&order=name");cat.innerHTML=c.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");catList.innerHTML=c.map(x=>`<p>• ${x.name}</p>`).join("");products=await api("products?select=*,categories(name)&active=eq.true&order=name");render();status.textContent="Connected to Gaon Mart database ✓";status.style.background="#e8f5e9"}catch(e){status.textContent="Connection/table check needed: "+e.message}}
function render(){pc.textContent=products.length;rows.innerHTML=products.map(x=>`<tr><td>${x.name}</td><td>${x.categories?.name||""}</td><td>${x.variant||""}</td><td>₹${x.price??""}</td><td>${x.stock??0}</td></tr>`).join("")}
async function addProduct(){let n=name.value.trim(),v=variant.value.trim(),p=Number(price.value),s=Number(stock.value||0),c=cat.value;if(!n||!v||!p||!c)return alert("Product, category, variant and price required");try{let x=await api("products",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({name:n,category_id:c,variant:v,price:p,stock:s,active:true})});products.push(...x);render();alert("Product saved ✓")}catch(e){alert("Save failed: "+e.message)}}load();
</script></body></html>
